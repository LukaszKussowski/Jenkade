name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build, test and check Polish text
        run: scripts/check.sh

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tests/Jenkade.App.Tests/bin/Release/net10.0/screenshots/
          if-no-files-found: ignore
